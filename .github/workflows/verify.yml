# Release gate for the Compass vault template.
#
# scripts/verify_template.py expects a BUILT copy of the vault (the output of
# scripts/build_template.py, normally build/Compass). This repository's root is
# such a built copy, so the gate runs against "." directly. Do not point it at
# a live vault: real notes, keys, and workspace state would fail the checks.
#
# Node is required because the script syntax-checks Meta/views/*.js with node.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify the template
        run: python3 scripts/verify_template.py .
